<html lang="en" data-theme="orange">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitch Countdown Widget</title>
<link rel="icon" type="image/png" href="icon.png">
<script>
(function(){
  var t = 'orange';
  try{
    var d = JSON.parse(window.localStorage.getItem('hitch-data') || 'null');
    if(d && d.theme) t = (d.theme === 'light' && !(Number(d.v) >= 3)) ? 'orange' : d.theme;
  }catch(e){}
  if(t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'orange';
  document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'orange');
})();
</script>
<style>
  @font-face{ font-family:'Barlow'; font-weight:500; font-display:swap; src:url('fonts/barlow-500.woff2') format('woff2'); }
  @font-face{ font-family:'Barlow'; font-weight:600; font-display:swap; src:url('fonts/barlow-600.woff2') format('woff2'); }
  @font-face{ font-family:'Barlow'; font-weight:700; font-display:swap; src:url('fonts/barlow-700.woff2') format('woff2'); }
  @font-face{ font-family:'Barlow Semi Condensed'; font-weight:700; font-display:swap; src:url('fonts/barlow-semi-condensed-700.woff2') format('woff2'); }
  :root{
    color-scheme: light;
    --card:#FFFFFF; --line:#E7E5E0; --line-strong:#DAD7D0; --ink:#14181F; --dim:#5A6270;
    --accent:#FF5A00; --accent-ink:#1A0E05; --bg:#F7F6F3;
    --travel-bg:#1D3557; --travel-ink:#FFFFFF; --track:#EFEDE8;
    --shadow: 0 14px 30px rgba(20,24,31,0.10), 0 2px 4px rgba(20,24,31,0.05);
    --warn:#8A2E00;
  }
  :root[data-theme="light"]{ --track:#F1F1EF; --bg:#FFFFFF; }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --card:#181B20; --line:#272B33; --line-strong:#383D47; --ink:#F3F3F1; --dim:#A1A7B1;
    --accent:#FF6A1A; --accent-ink:#1A0E05; --bg:#0F1114;
    --travel-bg:#9DBBEA; --travel-ink:#0E1B2E; --track:#262A31;
    --shadow: 0 14px 30px rgba(0,0,0,0.4);
    --warn:#FFB98F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: transparent;
    font-family: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height: 100vh; padding: 12px;
  }
  .widget{
    width: 100%; max-width: 340px;
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 18px 20px 16px; color: var(--ink);
  }
  .eyebrow{ font-size: 12px; font-weight: 700; color: var(--dim); letter-spacing: .8px; text-transform: uppercase; overflow-wrap: anywhere; }
  .count-row{ display:flex; align-items:baseline; gap: 10px; margin-top: 2px; }
  .count{ font-family:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; font-weight: 700; font-size: 76px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .count-unit{ font-size: 16px; font-weight: 600; color: var(--dim); }
  .phase{ display:inline-flex; align-items:center; gap: 8px; margin-top: 8px; min-height: 32px; padding: 0 12px; border-radius: 10px; font-family:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); }
  .phase::before{ content:''; width: 8px; height: 8px; border-radius: 4px; background: currentColor; }
  .phase.off{ background: var(--ink); color: var(--bg); }
  .phase.travel{ background: var(--travel-bg); color: var(--travel-ink); }
  .next-date{ font-size: 13px; font-weight: 500; color: var(--dim); margin-top: 10px; }
  .next-date strong{ color: var(--ink); font-weight: 700; }
  .track{ margin-top: 12px; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .fill{ height: 100%; background: var(--accent); transition: width .4s ease; }
  @media (prefers-reduced-motion: reduce){ .fill{ transition:none; } }
  .updated{ margin-top: 10px; font-size: 11px; font-weight: 500; color: var(--dim); }
  .fallback-note{ margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--warn); }
</style>
</head>
<body>
  <div class="widget">
    <div class="eyebrow" id="eyebrow">Hitch Countdown</div>
    <div class="count-row">
      <span class="count" id="count">--</span>
      <span class="count-unit" id="unit">days</span>
    </div>
    <div class="phase" id="phase">Loading…</div>
    <div class="next-date" id="nextDate"></div>
    <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="updated" id="updated"></div>
    <div class="fallback-note" id="fallbackNote" style="display:none;"></div>
  </div>

<script>
(function(){
  'use strict';
  const DATA_KEY = 'hitch-data';      // v1.3+ : all rotations
  const OLD_KEY = 'hitch-settings';   // v1.0 / v1.1 : one rotation

  function parseDate(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function daysBetween(a,b){
    const MS = 24*60*60*1000;
    const da = new Date(a.getFullYear(),a.getMonth(),a.getDate());
    const db = new Date(b.getFullYear(),b.getMonth(),b.getDate());
    return Math.round((db-da)/MS);
  }
  function addDays(d, n){
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate()+n);
    return r;
  }
  function fmtDate(d){
    return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }
  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function whole(v){ const n = Math.floor(Number(v)); return isFinite(n) ? n : 0; }

  // Same rules as the main app.
  function normalize(s){
    s = s || {};
    const onDays = clamp(whole(s.onDays) || 14, 1, 365);
    const offDays = clamp(whole(s.offDays) || 14, 1, 365);
    const travelOut = clamp(whole(s.travelOut), 0, offDays);
    const travelHome = clamp(whole(s.travelHome), 0, offDays - travelOut);
    const startDate = /^\d{4}-\d{2}-\d{2}$/.test(s.startDate || '') && !isNaN(parseDate(s.startDate)) ? s.startDate : todayStr();
    const shift = (s.shift === 'day' || s.shift === 'night') ? s.shift : 'none';
    const name = String(s.name == null ? '' : s.name).trim().slice(0, 24);
    return { onDays, offDays, startDate, travelOut, travelHome, shift, name };
  }

  async function readStore(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{
        const res = await window.storage.get(key, false);
        if(res && res.value) return res.value;
      }catch(e){}
    }
    try{ return window.localStorage.getItem(key); }catch(e){ return null; }
  }

  async function loadSettings(){
    try{
      const raw = await readStore(DATA_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d && Array.isArray(d.profiles) && d.profiles.length){
          const pick = d.profiles.find(p => p && p.id === d.widgetId) ||
                       d.profiles.find(p => p && p.id === d.activeId) || d.profiles[0];
          const theme = (d.theme === 'light' && !(Number(d.v) >= 3)) ? 'orange' : d.theme;
          return { settings: normalize(pick), usedFallback: false, many: d.profiles.length > 1, theme };
        }
      }
      const old = await readStore(OLD_KEY);
      if(old){
        const p = JSON.parse(old);
        if(p && p.onDays && p.offDays && p.startDate) return { settings: normalize(p), usedFallback: false, many: false, theme: 'orange' };
      }
    }catch(e){
      // nothing saved yet in the main app
    }
    return { settings: normalize({}), usedFallback: true, many: false, theme: 'orange' };
  }

  function applyTheme(choice){
    let t = (choice === 'dark' || choice === 'light') ? choice : 'orange';
    if(choice === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'orange';
    document.documentElement.setAttribute('data-theme', t);
  }

  function phaseAt(s, dateObj){
    const cycleLen = s.onDays + s.offDays;
    let pos = daysBetween(parseDate(s.startDate), dateObj) % cycleLen;
    if(pos < 0) pos += cycleLen;
    const homeEnd = s.onDays + s.travelHome;
    const outStart = cycleLen - s.travelOut;
    const toHitch = cycleLen - pos;
    if(pos < s.onDays) return { kind:'on', day: pos+1, total: s.onDays, left: s.onDays - pos, toHitch };
    if(pos < homeEnd) return { kind:'travelHome', day: pos - s.onDays + 1, total: s.travelHome, left: homeEnd - pos, toHitch };
    if(pos < outStart) return { kind:'off', day: pos - homeEnd + 1, total: outStart - homeEnd, left: outStart - pos, toHitch };
    return { kind:'travelOut', day: pos - outStart + 1, total: s.travelOut, left: toHitch, toHitch };
  }

  async function render(){
    const { settings, usedFallback, many, theme } = await loadSettings();
    applyTheme(theme);
    const today = new Date();
    const p = phaseAt(settings, today);

    const phaseEl = document.getElementById('phase');
    const fallbackEl = document.getElementById('fallbackNote');

    let count, next;
    if(p.kind === 'on'){
      count = p.left;
      const shift = settings.shift === 'day' ? ' · days' : settings.shift === 'night' ? ' · nights' : '';
      phaseEl.textContent = 'On hitch'+shift+' — home in';
      phaseEl.className = 'phase on';
      next = 'Crew change: <strong>'+fmtDate(addDays(today, p.left))+'</strong>';
    } else if(p.kind === 'travelHome'){
      count = p.left;
      phaseEl.textContent = 'Travel day — home in';
      phaseEl.className = 'phase travel';
      next = 'Home: <strong>'+fmtDate(addDays(today, p.left))+'</strong>';
    } else if(p.kind === 'off'){
      count = p.toHitch;
      phaseEl.textContent = 'Off hitch — back out in';
      phaseEl.className = 'phase off';
      next = settings.travelOut > 0
        ? 'Leave home: <strong>'+fmtDate(addDays(today, p.left))+'</strong>'
        : 'Crew change: <strong>'+fmtDate(addDays(today, p.toHitch))+'</strong>';
    } else {
      count = p.left;
      phaseEl.textContent = 'Travel day — on hitch in';
      phaseEl.className = 'phase travel';
      next = 'Hitch starts: <strong>'+fmtDate(addDays(today, p.left))+'</strong>';
    }

    document.getElementById('eyebrow').textContent = many && settings.name ? 'Hitch Countdown · ' + settings.name : 'Hitch Countdown';
    document.getElementById('count').textContent = count;
    document.getElementById('unit').textContent = 'day'+(count===1?'':'s');
    document.getElementById('nextDate').innerHTML = next;
    document.getElementById('fill').style.width = Math.round((p.day/p.total)*100)+'%';
    document.getElementById('updated').textContent = 'Updated '+today.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

    if(usedFallback){
      fallbackEl.style.display = 'block';
      fallbackEl.textContent = 'No saved rotation found — showing default 14/14. Set your rotation in the main Hitch Countdown app.';
    } else {
      fallbackEl.style.display = 'none';
    }
  }

  render();
  // Keep the widget fresh if left open across a day change
  setInterval(render, 60 * 1000);
  // Pick up a new rotation or theme as soon as the main app saves one
  window.addEventListener('storage', (e)=>{ if(!e.key || e.key === DATA_KEY || e.key === OLD_KEY) render(); });
})();
</script>
</body>
</html>
